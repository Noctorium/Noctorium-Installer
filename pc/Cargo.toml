[package]
name = "noctorium-installer"
version = "1.4.0"
edition = "2021"
# zip's floor; eframe's is 1.85. The oldest toolchain this builds on.
rust-version = "1.88"
description = "Fetches the latest Noctorium release from GitHub and installs it"
license = "Proprietary"
publish = false
default-run = "noctorium-installer"

# Two programs over one library. Everything that decides what to install and does it is in the library,
# so the window and the terminal cannot drift apart: they ask the same questions of the same code and get
# the same failures, in the same words.
[lib]
name = "noctorium_installer"
path = "src/lib.rs"

# The window. Built only with the gui feature, which is on by default -- a plain `cargo build` makes both.
# On a Mac it is built without a window at all, because the toolkit is left out there (below), and is then
# the terminal installer under another name; the release ships only noctorium-installer-cli for a Mac.
[[bin]]
name = "noctorium-installer"
path = "src/main.rs"
required-features = ["gui"]

# The terminal one, a console program on Windows so it behaves in cmd, PowerShell and Windows Terminal
# rather than borrowing a console it was not started with.
[[bin]]
name = "noctorium-installer-cli"
path = "src/bin/noctorium-installer-cli.rs"

[features]
default = ["gui"]
# Off for the terminal build, which then carries no toolkit at all: `cargo build --no-default-features
# --bin noctorium-installer-cli` is a download, a checksum and an unpacker, and links on musl as a single
# static file that runs on any Linux.
gui = ["dep:eframe"]

[dependencies]
# Blocking HTTP with rustls, and small: this program is a download and a checksum, and an async runtime
# would be most of the binary. Redirects are followed, which GitHub's asset URLs rely on.
ureq = "2"
# Read only. The release JSON is a handful of fields and deriving structs for it would cost a proc-macro
# dependency to save a dozen lines.
serde_json = "1"
sha2 = "0.10"
# The Noctorium CLI ships as a .tar.gz for Linux and a .zip for Windows, and both are unpacked here rather
# than by whatever tar the machine has: Windows only gained one in 2018, and an unpacker that is part of
# this program can be tested. miniz_oxide underneath both, so there is no C to build.
flate2 = "1"
tar = { version = "0.4", default-features = false }
# Reading and the plain deflate that every zip tool writes. The rest of the defaults -- AES, bzip2, zstd,
# lzma -- would triple the size of the program for archives nobody makes.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

# The window. Immediate mode, so the whole interface is a function of the progress reported so far and
# there is no widget tree to keep in step with a download running on another thread.
#
# Trimmed to what is used: its own fonts, OpenGL, both display servers on Linux, and the accessibility
# tree, because somebody using a screen reader has to be able to install a music player too. Left out is
# the web backend and the persistence that would write a window position into somebody's config
# directory -- this program runs once and should leave nothing behind.
#
# Not on a Mac. There is no window installer for one -- a Mac gets the terminal installer, fetched by the
# one-line script -- so the toolkit would be some ninety crates compiled for nothing. Leaving it out here
# rather than behind --no-default-features means a plain `cargo build` or `cargo test` on a Mac works too.
[target.'cfg(not(target_os = "macos"))'.dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"], optional = true }

# geteuid, which is the only honest answer to "is this root": USER and HOME are whatever the environment
# says, and sudo, su and a container all say different things. On a Mac, also sysctl, which says what the
# processor really is when this program is running under Rosetta, and access, which says whether
# /Applications can be written to.
[target."cfg(unix)".dependencies]
libc = "0.2"

# The console, for colour and for borrowing the one the window program was started from; the registry,
# for the user's PATH, for the folder Noctorium is already installed in and for Noctorium Stats' entry
# in Apps & features; the broadcast that tells Explorer the PATH has changed; the list of running
# programs, to see whether Noctorium is one; and COM, which is the only way to make a Start menu shortcut.
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# Decodes the mark at build time, so the binary carries the pixels rather than a PNG decoder it would use
# exactly once.
png = "0.18.1"

[profile.release]
# The whole point is a small file somebody downloads before they have anything else.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Except where the time goes. Every byte this program fetches is hashed, and the Noctorium CLI's archive is
# inflated and checked against its CRC as it is unpacked: all of that is in these crates, and built for
# size it runs at a fraction of the speed it can -- SHA-256 most of all, whose processor instructions are
# only fast when they are inlined, which "z" declines to do. Measured on a Ryzen 5 7600, hashing 341 MB
# went from 0.75 s to 0.20 s and unpacking the 60 MB Windows CLI archive from 0.54 s to 0.47 s, for 30 KB
# more program: 7.7 KB of it SHA-256, the rest inflating. Everything else stays as small as it can be.
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.flate2]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.adler2]
opt-level = 3
[profile.release.package.zip]
opt-level = 3
[profile.release.package.tar]
opt-level = 3
