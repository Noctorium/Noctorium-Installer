name: noctorium_installer
description: Fetches the latest Noctorium release from GitHub and hands it to Android's installer.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Three small ones, and nothing else. This application is a download, a hash and an intent.
  http: ^1.2.0
  crypto: ^3.0.3
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
