// The shape Flutter's Android template has taken since 3.16: the SDK is found through local.properties,
// which the flutter tool writes, and the plugin loader brings in whatever packages pubspec asked for.
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Newer than the 8.7.3 Noctorium itself is built with, because Flutter's Gradle plugin refuses
    // anything below 8.11.1 and says so. Nothing is shared between the two builds but the Gradle
    // distribution, so they are free to differ.
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.21" apply false
}

include ":app"
