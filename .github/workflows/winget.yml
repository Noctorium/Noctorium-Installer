name: winget

# Every published release, offered on winget: `winget install Noctorium.Noctorium` for the desktop app, and
# Noctorium.CLI, Noctorium.Rust, Noctorium.Stats and Noctorium.SongFind for the others.
#
# winget's packages live in microsoft/winget-pkgs as manifests that point at this repository's release files. winget/
# holds them, one folder per package, with ${VERSION}, ${SHA256} and ${DATE} for this to fill in; komac then opens
# the pull request to winget-pkgs from the account that owns WINGET_TOKEN (a classic token with public_repo), which
# Microsoft's bots test and merge. A package that is new there waits for a moderator as well, the first time.
#
# A release published by hand starts this; one Release publishes by itself (see yt-dlp.yml) starts it through a
# dispatch, as a release published with GitHub's own token starts nothing else. A package that fails does not stop
# the others, and winget never holds a release up.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to offer, without the leading v (e.g. 0.34.1)'
        required: true
      dry_run:
        description: 'Only write the manifests and show them'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: winget-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

env:
  KOMAC_VERSION: 2.17.2
  KOMAC_NO_UPDATE_NOTIFIER: '1'

jobs:
  submit:
    name: Pull requests to winget-pkgs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fill in the manifests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
        run: |
          set -euo pipefail
          export VERSION="${TAG#v}"
          export DATE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt -q '.publishedAt[0:10]')"
          # The release's own SHA256 of every file, as GitHub computed it on upload.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[] | "\(.name) \(.digest)"' > digests
          for folder in winget/*/; do
            id="$(basename "$folder")"
            asset="$(grep -o 'releases/download/[^ ]*' "$folder/$id.installer.yaml" | sed 's|.*/||' | VERSION="$VERSION" envsubst '${VERSION}')"
            digest="$(awk -v name="$asset" '$1 == name { print $2 }' digests)"
            [ -n "$digest" ] || { echo "::error::$TAG has no $asset for $id"; exit 1; }
            export SHA256="$(echo "${digest#sha256:}" | tr a-f A-F)"
            mkdir -p "out/$id"
            for manifest in "$folder"*.yaml; do
              envsubst '${VERSION} ${SHA256} ${DATE}' < "$manifest" > "out/$id/$(basename "$manifest")"
            done
            echo "$id $VERSION: $asset"
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Show them
        run: for f in out/*/*.yaml; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done

      - name: Get komac
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file="komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "v$KOMAC_VERSION" --repo russellbanks/Komac -p "$file" -p SHA256SUMS -D komac
          (cd komac && grep " $file\$" SHA256SUMS | sha256sum -c - && tar -xzf "$file")
          echo "$PWD/komac" >> "$GITHUB_PATH"
          "$PWD/komac/komac" --version

      - name: Open the pull requests
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_CREATED_WITH: Noctorium-Installer
          KOMAC_CREATED_WITH_URL: https://github.com/${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::warning::No WINGET_TOKEN secret, so nothing went to winget. Add a classic token with public_repo."
            exit 0
          fi
          failed=""
          for folder in out/*/; do
            id="$(basename "$folder")"
            echo "::group::$id $VERSION"
            komac submit "$folder" --yes || failed="$failed $id"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Not sent to winget:$failed"
            exit 1
          fi
