name: Packaging

# Every Linux format, everything for the Mac, every PC installer and all of Noctorium Stats, built as a
# release would build them, and attached to the run rather than to a release. This is how the packaging is
# tried: push a branch named packaging/something, or run it by hand from the Actions tab against any branch
# or commit of the desktop.
#
# The tests, the Windows installer and Noctorium's APK are left out. They are release.yml's, unchanged by
# any of this, and twenty minutes of Windows packaging is not what anybody trying an Arch package is
# waiting for. Noctorium Stats is in, APK and all, because it is new and its packaging is the part most
# likely to want trying; it builds from its repositories' main branches unless told otherwise.
on:
  push:
    branches: ['packaging/**']
  workflow_dispatch:
    inputs:
      desktop_ref:
        description: 'Noctorium-Desktop branch, tag or commit to build'
        required: false
        default: 'main'
      cli_ref:
        description: 'Noctorium-cli branch, tag or commit to build (for the Mac)'
        required: false
        default: 'main'
      stats_desktop_ref:
        description: 'Noctorium-Stats-Desktop branch, tag or commit to build'
        required: false
        default: 'main'
      stats_mobile_ref:
        description: 'Noctorium-Stats-Mobile branch, tag or commit to build'
        required: false
        default: 'main'
      version:
        description: 'Version to call it, without the leading v (empty for the latest release)'
        required: false
        default: ''

# Nothing here publishes anything, so it needs to read and no more.
permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push has no inputs, and every file is named after a version, so it borrows the latest release's:
  # the names then look exactly like the ones the next release will carry.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          ASKED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$ASKED" ]; then
            version="$ASKED"
          else
            version=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          version="${version#v}"
          echo "Building as $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux
    needs: version
    uses: ./.github/workflows/linux.yml
    with:
      version: ${{ needs.version.outputs.version }}
      desktop_ref: ${{ inputs.desktop_ref || 'main' }}

  pc-installer:
    name: PC installer
    uses: ./.github/workflows/pc-installer.yml

  macos:
    name: macOS
    needs: version
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
      desktop_ref: ${{ inputs.desktop_ref || 'main' }}
      cli_ref: ${{ inputs.cli_ref || 'main' }}

  stats:
    name: Noctorium Stats
    needs: version
    uses: ./.github/workflows/stats.yml
    with:
      version: ${{ needs.version.outputs.version }}
      desktop_ref: ${{ inputs.stats_desktop_ref || 'main' }}
      mobile_ref: ${{ inputs.stats_mobile_ref || 'main' }}
    # For the APK's signing key. Without it the APK is signed with the debug key, and says so.
    secrets: inherit
