name: Packaging

# Every Linux format and every PC installer, built as a release would build them, and attached to the run
# rather than to a release. This is how the packaging is tried: push a branch named packaging/something,
# or run it by hand from the Actions tab against any branch or commit of the desktop.
#
# The tests, the Windows installer and the APK are left out. They are release.yml's, unchanged by any of
# this, and twenty minutes of Windows packaging is not what anybody trying an Arch package is waiting for.
on:
  push:
    branches: ['packaging/**']
  workflow_dispatch:
    inputs:
      desktop_ref:
        description: 'Noctorium-Desktop branch, tag or commit to build'
        required: false
        default: 'main'
      version:
        description: 'Version to call it, without the leading v (empty for the latest release)'
        required: false
        default: ''

# Nothing here publishes anything, so it needs to read and no more.
permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push has no inputs, and every file is named after a version, so it borrows the latest release's:
  # the names then look exactly like the ones the next release will carry.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          ASKED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$ASKED" ]; then
            version="$ASKED"
          else
            version=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          version="${version#v}"
          echo "Building as $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux
    needs: version
    uses: ./.github/workflows/linux.yml
    with:
      version: ${{ needs.version.outputs.version }}
      desktop_ref: ${{ inputs.desktop_ref || 'main' }}

  pc-installer:
    name: PC installer
    uses: ./.github/workflows/pc-installer.yml
