name: CI

# The installers themselves: a Rust program for Windows and Linux, and a Flutter application for
# Android. Neither one touches the application repositories, so nothing here needs a deploy key.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pc:
    name: PC installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One failing platform should not hide the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pc

      # The window is drawn with OpenGL through X11 or Wayland, and those headers are not on the runner.
      # Windows has its own in the SDK, so this is the Linux leg only.
      - name: Libraries the window is built against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Build
        run: cargo build --release

      # Kept from every run, so there is always a current installer to try without cutting a release.
      - uses: actions/upload-artifact@v4
        with:
          name: pc-installer-${{ matrix.os }}
          path: |
            pc/target/release/noctorium-installer
            pc/target/release/noctorium-installer.exe
          if-no-files-found: error
          retention-days: 14

  phone:
    name: Phone installer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: phone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Lints
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build the APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: phone-installer-apk
          path: phone/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
